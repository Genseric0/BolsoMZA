name: BolsoMZ - Autenticação e Android (v1.1)
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['android/**','app.js','app.css','core.js','vault.js','index.html','assets/**','.github/workflows/android-apk.yml']
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testes e integridade antes da compilação
        run: |
          npm run android:sync
          npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar testes de interface
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Cadastro, login e movimentos no ecrã
        run: |
          python tests/test_native_auth_flow.py
          python tests/test_persistence_ui.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: SDK Android
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "SDK root: $SDK_ROOT"
          if [[ -d "$SDK_ROOT/platforms/android-35" && -d "$SDK_ROOT/build-tools/35.0.0" ]]; then
            echo "Android SDK 35 e build-tools 35 já disponíveis."
          else
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
            if [[ -z "$SDKMANAGER" ]]; then
              echo "::error::Android SDK Manager não localizado."
              exit 1
            fi
            "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Criar APK Android (assinatura de teste)
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Verificar APK gerado
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BolsoMZ-v1-1-Android-APK-TESTE
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  emulator:
    name: Teste do cofre no emulador Android
    runs-on: ubuntu-latest
    needs: apk
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Testes Android reais (emulador API 30)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: cd android && gradle --no-daemon :app:connectedDebugAndroidTest
