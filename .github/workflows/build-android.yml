name: BolsoMZ — Compilar APK Android
on:
  push:
    branches: [main]
    paths:
      - 'BolsoMZ-v1.0-projeto-Android.zip'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Testar e compilar APK debug
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4
      - name: Verificar e extrair o pacote
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s BolsoMZ-v1.0-projeto-Android.zip ]; then
            echo "::error title=Pacote BolsoMZ em falta::Carrega BolsoMZ-v1.0-projeto-Android.zip na raiz do repositorio (Add file > Upload files > Commit changes). Reexecutar o workflow sem carregar o ZIP nao resolve."
            exit 1
          fi
          test "$(stat -c%s BolsoMZ-v1.0-projeto-Android.zip)" -lt 50000000
          unzip -tqq BolsoMZ-v1.0-projeto-Android.zip
          mkdir -p project
          unzip -q BolsoMZ-v1.0-projeto-Android.zip -d project
          test -f project/BolsoMZ/package.json
          test -f project/BolsoMZ/android/app/build.gradle
          test -f project/BolsoMZ/android/app/src/main/java/mz/bolso/app/MainActivity.java
      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testes de lógica e segurança
        working-directory: project/BolsoMZ
        run: |
          node --check app.js
          node --check core.js
          node --check vault.js
          npm test
          npm run android:sync
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Instalar Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compilar APK de teste
        working-directory: project/BolsoMZ/android
        run: gradle --no-daemon :app:assembleDebug
      - name: Verificar existência do APK
        run: test -s project/BolsoMZ/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Disponibilizar APK para descarregar
        uses: actions/upload-artifact@v4
        with:
          name: BolsoMZ-APK-Android
          path: project/BolsoMZ/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
